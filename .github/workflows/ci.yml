name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python testovi
        run: python3 -m unittest discover -s tests -q

      - name: Node testovi
        run: node --test "tests/node/**/*.test.js"

      - name: Izgradnja sajta
        run: python3 -m zg build

      - name: Sve kapije (uključuje tabelu u README-u i ažurnost izgradnje)
        run: python3 -m zg all

      # The page package is made here, at the end of this job; the deploy job only deploys it.
      # Made in the deploy job itself, it was asked for a second after the upload started (not
      # found), and a rerun then made a second package with the same name (found twice).
      - name: Paket sajta za objavu
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

